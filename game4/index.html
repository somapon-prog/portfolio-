<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football Pro</title>
<style>
body{margin:0;background:#16a34a;font-family:Arial;text-align:center;color:white}
h1{font-size:28px;margin:10px}
#field{width:95vw;max-width:500px;height:70vh;max-height:600px;background:#15803d;border:6px solid white;margin:10px auto;position:relative;border-radius:15px}
#keeper{position:absolute;top:30px;left:42%;font-size:60px;transition:0.3s}
#ball{position:absolute;bottom:30px;left:42%;font-size:60px;transition:0.5s}
button{padding:20px 30px;font-size:22px;font-weight:bold;margin:8px;border-radius:12px;border:none}
</style>
</head>
<body>
<h1>⚽ FOOTBALL GAME ⚽</h1>
<h2 id="sc" style="font-size:30px">Score: 0</h2>
<div id="field">
<div id="keeper">🧤</div>
<div id="ball">⚽</div>
</div>
<button onclick="shoot(0)">⬅ LEFT</button>
<button onclick="shoot(1)" style="background:yellow">CENTER</button>
<button onclick="shoot(2)">RIGHT ➡</button>
<br><br>
<a href="../" style="color:yellow;font-size:20px">⬅ BACK</a>
<script>
let s=0;
function shoot(d){
let kp=Math.floor(Math.random()*3);
let k=document.getElementById('keeper');
k.style.left=kp==0?'10%':kp==1?'42%':'75%';
let b=document.getElementById('ball');
b.style.left=d==0?'15%':d==1?'42%':'78%';
b.style.bottom='75%';
setTimeout(()=>{
if(d!=kp){s++;document.getElementById('sc').innerText='Score: '+s}
else{alert('Saved! Score: '+s);s=0;document.getElementById('sc').innerText='Score: 0'}
b.style.bottom='30px';b.style.left='42%';
},600);
}
</script>
</body>
</html>
