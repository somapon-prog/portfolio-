<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Football</title>
</head>
<body style="background:#22c55e;margin:0;text-align:center;font-family:Arial;color:white">
<a href="../" style="display:block;background:black;color:white;padding:10px;text-decoration:none">⬅ BACK TO 50 GAMES</a>
<h1 style="color:black">FOOTBALL ⚽ Score: <span id="sc">0</span></h1>

<div style="width:320px;height:400px;background:#15803d;border:5px solid white;margin:10px auto;position:relative;border-radius:10px">
<div style="width:200px;height:60px;border:4px solid white;border-bottom:0;margin:0 auto;background:rgba(255,255,255,0.2)"></div>
<div id="keeper" style="position:absolute;top:40px;left:135px;font-size:35px;transition:0.3s">🧤</div>
<div id="ball" style="position:absolute;bottom:20px;left:140px;font-size:35px;transition:0.5s">⚽</div>
</div>

<button onclick="shoot(0)" style="padding:15px 25px;font-size:18px;margin:5px">LEFT</button>
<button onclick="shoot(1)" style="padding:15px 25px;font-size:18px;margin:5px;background:yellow">CENTER</button>
<button onclick="shoot(2)" style="padding:15px 25px;font-size:18px;margin:5px">RIGHT</button>

<script>
let score=0;
function shoot(dir){
 let k=document.getElementById('keeper');
 let b=document.getElementById('ball');
 let kp=Math.floor(Math.random()*3);
 k.style.left = kp==0?'30px':kp==1?'135px':'240px';
 b.style.left = dir==0?'40px':dir==1?'140px':'240px';
 b.style.bottom='340px';
 setTimeout(()=>{
  if(dir!=kp){score++; document.getElementById('sc').innerText=score;}
  else{alert('Keeper Saved! Final Score: '+score); score=0; document.getElementById('sc').innerText=0;}
  b.style.bottom='20px';
 },600);
}
</script>
</body>
</html>
