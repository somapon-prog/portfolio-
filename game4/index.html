<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width,initial-scale=1">
<style>body{margin:0;background:#16a34a;text-align:center;font-family:Arial;color:#fff}
#box{width:310px;height:380px;background:#15803d;border:4px solid #fff;margin:12px auto;position:relative;border-radius:10px}
#k{position:absolute;top:15px;left:125px;font-size:38px;transition:.3s}
#b{position:absolute;bottom:15px;left:130px;font-size:38px;transition:.4s}
button{padding:12px 16px;margin:4px;border-radius:8px;border:0;font-weight:bold}
</style></head><body>
<h3>⚽ FOOTBALL GAME ⚽</h3>
<h3 id="s">Score: 0</h3>
<div id="box"><div id="k">🧤</div><div id="b">⚽</div></div>
<button onclick="go(0)">⬅ LEFT</button>
<button onclick="go(1)" style="background:yellow">CENTER</button>
<button onclick="go(2)">RIGHT ➡</button><br><br>
<a href="../" style="color:yellow">⬅ BACK</a>
<script>let sc=0;function go(d){let p=Math.floor(Math.random()*3);let k=document.getElementById('k');k.style.left=p==0?'15px':p==1?'125px':'230px';let b=document.getElementById('b');b.style.left=d==0?'20px':d==1?'130px':'235px';b.style.bottom='300px';setTimeout(()=>{if(d!=p){sc++;document.getElementById('s').innerText='Score: '+sc}else{alert('Saved! Score '+sc);sc=0;document.getElementById('s').innerText='Score: 0'}b.style.bottom='15px'},450)}</script>
</body></html>
