<!DOCTYPE html>
<html>
<body style="background:green;text-align:center;color:white;font-family:Arial">
<h1>FOOTBALL GAME ⚽</h1>
<h2 id="s">Score: 0</h2>
<div style="width:300px;height:400px;background:darkgreen;margin:20px auto;border:3px solid white;position:relative">
<div id="k" style="position:absolute;top:20px;left:120px;font-size:30px">🧤</div>
<div id="b" style="position:absolute;bottom:20px;left:130px;font-size:30px">⚽</div>
</div>
<button onclick="g(0)" style="padding:15px">LEFT</button>
<button onclick="g(1)" style="padding:15px">CENTER</button>
<button onclick="g(2)" style="padding:15px">RIGHT</button>
<br><br><a href="../" style="color:yellow">BACK</a>
<script>
let sc=0;
function g(d){
let k=Math.floor(Math.random()*3);
let kb=document.getElementById('k');
kb.style.left=k==0?'20px':k==1?'120px':'220px';
let bb=document.getElementById('b');
bb.style.left=d==0?'30px':d==1?'130px':'230px';
bb.style.bottom='350px';
setTimeout(()=>{
if(d!=k){sc++;document.getElementById('s').innerHTML='Score: '+sc;}
else{alert('Saved! Score '+sc);sc=0;document.getElementById('s').innerHTML='Score: 0';}
bb.style.bottom='20px';
},500);
}
</script>
</body>
</html>
