<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>MOTO X3M REAL</title><style>*{margin:0;padding:0;box-sizing:border-box;touch-action:none}body{background:#87CEEB;overflow:hidden}canvas{display:block}#hud{position:fixed;top:0;left:0;right:0;height:50px;background:#111;color:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 15px;z-index:10;border-bottom:4px solid #ff6b00;font-family:Arial Black}#pad{position:fixed;bottom:0;left:0;right:0;height:130px;display:flex;justify-content:space-between;padding:12px;background:linear-gradient(transparent,#0009);z-index:10}.b{width:85px;height:85px;border-radius:20px;border:3px solid #fff;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#fff;font-weight:900}.b:active{transform:scale(0.9)}</style></head><body>
<div id="hud"><div>⏱ <span id="tm">00:00</span></div><div style="color:#ff6b00">MOTO X3M REAL RIDER</div><div>FINISH 🏁</div></div>
<canvas id="c"></canvas>
<div id="pad"><div style="display:flex;gap:10px"><div class="b" id="L" style="background:#2563eb">↩ TILT</div><div class="b" id="B" style="background:#ef4444">! BRAKE</div></div><div style="display:flex;gap:10px"><div class="b" id="G" style="background:#22c55e">⚡ GAS</div><div class="b" id="R" style="background:#2563eb">TILT ↪</div></div></div>
<script>
const cv=document.getElementById('c'), cx=cv.getContext('2d'); cv.width=innerWidth; cv.height=innerHeight;
let bike={x:100,y:0,vx:0,vy:0,a:0,va:0}, keys={}, cam=0, time=0, ground=[];
for(let i=0;i<500;i++){let x=i*60, y=450; if(i>10&&i<18) y-= (i-10)*28; if(i>=18&&i<24) y=160; if(i>=24&&i<30) y=160+(i-24)*50; if(i>60&&i<75) y=380+Math.sin(i)*20; if(i>120&&i<135) y=320; ground.push({x,y});}
function GY(xx){let i=Math.floor(xx/60); if(i<0)i=0; if(i>=ground.length-1)i=ground.length-2; let g1=ground[i], g2=ground[i+1]; let t=(xx-g1.x)/60; return g1.y*(1-t)+g2.y*t;}
function loop(){
 time+=0.016; if(keys.g) bike.vx+=0.3; if(keys.b) bike.vx-=0.4; if(keys.l) bike.va-=0.11; if(keys.r) bike.va+=0.11;
 bike.vx*=0.985; bike.vx=Math.max(-2,Math.min(10,bike.vx)); bike.vy+=0.6; bike.x+=bike.vx; bike.y+=bike.vy;
 let gy=GY(bike.x); if(bike.y+22>gy){bike.y=gy-22; bike.vy=0; let ang=Math.atan2(GY(bike.x+20)-GY(bike.x-20),40); bike.a+=(ang-bike.a)*0.2; bike.a+=bike.va*0.1; bike.va*=0.9;} else {bike.a+=bike.va*0.2;}
 cam+=(bike.x-150-cam)*0.1;
 cx.fillStyle='#87CEEB'; cx.fillRect(0,0,cv.width,cv.height); cx.fillStyle='#FFD700'; cx.beginPath(); cx.arc(cv.width-100,90,45,0,7); cx.fill();
 cx.save(); cx.translate(-cam,0);
 cx.strokeStyle='#5a3410'; cx.lineWidth=12; cx.beginPath(); ground.forEach((g,i)=>{if(i==0)cx.moveTo(g.x,g.y); else cx.lineTo(g.x,g.y)}); cx.stroke();
 cx.fillStyle='#d89a5a'; cx.beginPath(); cx.moveTo(0,600); ground.forEach(g=>cx.lineTo(g.x,g.y)); cx.lineTo(ground[ground.length-1].x,600); cx.fill();
 // FINISH
 cx.fillStyle='#000'; cx.fillRect(28000,GY(28000)-120,12,120); cx.fillStyle='#fff'; cx.fillRect(28012,GY(28000)-120,80,30);
 // RIDER - REAL MOTO X3M STYLE
 cx.save(); cx.translate(bike.x,bike.y); cx.rotate(bike.a);
 // bike
 cx.fillStyle='#111'; cx.beginPath(); cx.arc(-16,14,13,0,7); cx.fill(); cx.beginPath(); cx.arc(20,14,13,0,7); cx.fill();
 cx.fillStyle='#ff5e00'; cx.fillRect(-16,-2,38,8); cx.fillStyle='#222'; cx.fillRect(-4,-10,16,8);
 // rider body like photo
 cx.fillStyle='#ff4a00'; cx.fillRect(-7,-22,15,18); // orange suit
 cx.fillStyle='#2aff00'; cx.fillRect(-9,0,6,14); cx.fillRect(6,0,6,14); // green boots
 cx.fillStyle='#ffcc99'; cx.fillRect(-8,-18,4,12); cx.fillRect(6,-18,4,12); // hands
 // helmet orange with blue goggles - EXACT LIKE YOUR PIC
 cx.fillStyle='#ff6b00'; cx.beginPath(); cx.arc(0,-32,12,0,7); cx.fill();
 cx.fillStyle='#2a9cff'; cx.fillRect(-1,-36,12,6); cx.fillStyle='#fff'; cx.fillRect(0,-35,10,2);
 cx.restore(); cx.restore();
 document.getElementById('tm').innerText=Math.floor(time/60)+':'+String(Math.floor(time%60)).padStart(2,'0');
 if(bike.x>28000){alert('YOU WIN!'); location.reload();}
 if(bike.y>650){bike.x-=150; bike.y=0; bike.vx=0;}
 requestAnimationFrame(loop);
}
function b(id,k){let e=document.getElementById(id); e.addEventListener('touchstart',ev=>{ev.preventDefault(); keys[k]=true}); e.addEventListener('touchend',ev=>{ev.preventDefault(); keys[k]=false}); e.addEventListener('mousedown',()=>keys[k]=true); e.addEventListener('mouseup',()=>keys[k]=false);}
b('G','g'); b('B','b'); b('L','l'); b('R','r'); loop();
</script></body></html>
