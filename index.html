<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MOTO X3M REAL</title><style>*{margin:0;padding:0;touch-action:none}body{background:#87CEEB;overflow:hidden}canvas{display:block}#h{position:absolute;top:8px;left:8px;background:#0009;color:#fff;padding:6px 12px;border-radius:20px;font-family:sans-serif;font-weight:bold}#p{position:absolute;bottom:0;width:100%;display:flex;justify-content:space-between;padding:10px}.b{width:70px;height:70px;background:#0007;border:2px solid #fff;border-radius:50%;color:#fff;display:flex;align-items:center;justify-content:center;font-size:24px}</style></head><body><div id="h">REAL MOTO X3M - <span id="t">00:00</span></div><canvas id="c"></canvas><div id="p"><div style="display:flex;gap:10px"><div class="b" id="L">◀</div><div class="b" id="R">▶</div></div><div style="display:flex;gap:10px"><div class="b" id="B">⏪</div><div class="b" id="G">⏩</div></div></div><script>
c=document.getElementById('c');x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
let bike={x:100,y:0,vx:0,vy:0,a:0,va:0},k={},tm=0,g=[];
for(let i=0;i<600;i++){let X=i*60,Y=480;if(i>10&&i<20)Y-=(i-10)*30;if(i>=20&&i<25)Y=180;if(i>=25&&i<32)Y=180+(i-25)*38;g.push({x:X,y:Y})}
function GY(X){let i=Math.floor(X/60);if(i<0||i>=599)return 500;let p=g[i],n=g[i+1],t=(X-p.x)/60;return p.y+t*(n.y-p.y)}
function GA(X){return Math.atan2(GY(X+20)-GY(X-20),40)}
function loop(){
tm+=0.016;if(k.g)bike.vx+=0.38;if(k.b)bike.vx-=0.38;if(k.l)bike.va-=0.13;if(k.r)bike.va+=0.13;
bike.vy+=0.9;bike.x+=bike.vx;bike.y+=bike.vy;bike.a+=bike.va;bike.va*=0.95;bike.vx*=0.987;
let gy=GY(bike.x);if(bike.y+26>=gy){bike.y=gy-26;bike.vy=0;let an=GA(bike.x);bike.a+=(an-bike.a)*0.18}
let cam=bike.x-120;
x.fillStyle='#87CEEB';x.fillRect(0,0,c.width,c.height);
x.save();x.translate(-cam,0);
x.strokeStyle='#5D4037';x.lineWidth=15;x.beginPath();g.forEach((p,i)=>{i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)});x.stroke();
x.fillStyle='#8D6E63';x.beginPath();x.moveTo(0,800);g.forEach(p=>x.lineTo(p.x,p.y));x.lineTo(g[599].x,800);x.fill();
x.fillStyle='#000';x.fillRect(30000,0,150,150);x.fillStyle='#FF0';x.font='bold 22px sans-serif';x.fillText('FINISH',30010,170);
x.save();x.translate(bike.x,bike.y);x.rotate(bike.a);
// wheels black
x.fillStyle='#111';x.beginPath();x.arc(-24,14,15,0,7);x.fill();x.beginPath();x.arc(26,14,15,0,7);x.fill();
x.fillStyle='#999';x.beginPath();x.arc(-24,14,5,0,7);x.fill();x.beginPath();x.arc(26,14,5,0,7);x.fill();
// REAL RIDER - Orange + Blue Goggles + Green Boots (Tomar Photo)
x.fillStyle='#2E7D32';x.fillRect(-13,1,8,18); // green boot
x.fillStyle='#FF6F00';x.fillRect(-15,-19,20,20); // orange suit
x.fillStyle='#FF6F00';x.fillRect(0,-19,18,5); // hand
x.fillStyle='#FFCC80';x.fillRect(15,-19,6,6);
// helmet orange black
x.fillStyle='#111';x.beginPath();x.arc(3,-30,12,0,7);x.fill();
x.fillStyle='#FF6F00';x.beginPath();x.arc(3,-30,10,0,7);x.fill();
// blue goggles - REAL
x.fillStyle='#0D47A1';x.fillRect(-2,-34,14,7);x.fillStyle='#42A5F5';x.fillRect(0,-33,10,3);
x.restore();x.restore();
document.getElementById('t').innerText=Math.floor(tm/60)+':'+String(Math.floor(tm%60)).padStart(2,'0');
if(bike.x>30000){alert('WIN! 🏆');location.reload()}
if(bike.y>700){bike.x-=80;bike.y=0;bike.vx=0}
requestAnimationFrame(loop)
}
function btn(id,key){let e=document.getElementById(id);e.ontouchstart=e.onmousedown=ev=>{ev.preventDefault();k[key]=1};e.ontouchend=e.onmouseup=()=>k[key]=0}
btn('G','g');btn('B','b');btn('L','l');btn('R','r');loop();
</script></body></html>
