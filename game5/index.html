<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo King</title>
<style>
body{margin:0;background:#0f172a;color:#fff;text-align:center;font-family:Arial}
canvas{background:#fff;border:4px solid #fde047;margin:10px auto;display:block;border-radius:10px}
#dice{font-size:50px;background:#fff;color:#000;width:80px;height:80px;line-height:80px;margin:10px auto;border-radius:15px}
#msg{color:#fde047;font-weight:bold}
button{padding:12px 24px;background:#fde047;border:0;border-radius:8px;font-weight:bold}
</style>
</head>
<body>
<h2>🎲 LUDO KING - FINAL 🎲</h2>
<div id="dice" onclick="roll()">🎲</div>
<div id="msg">RED Turn - 6 lagbe</div>
<canvas id="c" width="330" height="330"></canvas>
<button onclick="roll()">ROLL DICE</button><br><br>
<a href="../" style="color:#fff">⬅ BACK</a>
<script>
let cv=document.getElementById('c'),ctx=cv.getContext('2d'),turn=0,pos=[-1,-1,-1,-1],names=['RED','GREEN','YELLOW','BLUE'],cols=['red','green','gold','blue'];
let path=[];
for(let i=1;i<6;i++)path.push([1,i]);for(let i=5;i>=0;i--)path.push([i,6]);path.push([0,7],[0,8]);for(let i=1;i<6;i++)path.push([i,8]);for(let i=9;i<15;i++)path.push([6,i]);path.push([7,14],[8,14]);for(let i=13;i>=9;i--)path.push([8,i]);for(let i=9;i<15;i++)path.push([i,8]);path.push([14,7],[14,6]);for(let i=13;i>=9;i--)path.push([i,6]);for(let i=5;i>=0;i--)path.push([8,i]);path.push([7,0]);

function draw(){
 ctx.clearRect(0,0,330,330);
 let s=22;
 // home
 ctx.fillStyle='#ef4444';ctx.fillRect(0,0,6*s,6*s);
 ctx.fillStyle='#22c55e';ctx.fillRect(9*s,0,6*s,6*s);
 ctx.fillStyle='#eab308';ctx.fillRect(0,9*s,6*s,6*s);
 ctx.fillStyle='#3b82f6';ctx.fillRect(9*s,9*s,6*s,6*s);
 // path
 ctx.fillStyle='#fff';path.forEach(p=>{ctx.fillRect(p[1]*s,p[0]*s,s,s);ctx.strokeRect(p[1]*s,p[0]*s,s,s)});
 // tokens
 for(let i=0;i<4;i++)if(pos[i]>=0){let p=path[pos[i]];ctx.fillStyle=cols[i];ctx.beginPath();ctx.arc(p[1]*s+s/2,p[0]*s+s/2,9,0,Math.PI*2);ctx.fill();ctx.stroke()}
}
function roll(){
 let v=Math.floor(Math.random()*6)+1;document.getElementById('dice').innerText=v;
 if(pos[turn]==-1){if(v==6)pos[turn]=0;else{turn=(turn+1)%4;document.getElementById('msg').innerText=names[turn]+' Turn';draw();return;}}
 else{pos[turn]+=v;if(pos[turn]>=path.length){alert(names[turn]+' WIN!');pos=[-1,-1,-1,-1];}}
 draw();if(v!=6)turn=(turn+1)%4;document.getElementById('msg').innerText=names[turn]+' Turn';
}
draw();
</script>
</body>
</html>
