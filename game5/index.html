<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ludo King</title>
<style>
body{margin:0;background:#fde047;text-align:center;font-family:Arial}
#board{width:340px;height:340px;background:#fff;border:4px solid #000;margin:10px auto;display:grid;grid-template-columns:repeat(15,1fr);grid-template-rows:repeat(15,1fr)}
.cell{border:0.5px solid #ddd;display:flex;align-items:center;justify-content:center}
.red{background:#ef4444}.green{background:#22c55e}.yellow{background:#eab308}.blue{background:#3b82f6}
#dice{font-size:40px;background:#fff;width:70px;height:70px;line-height:70px;margin:10px auto;border:3px solid #000;border-radius:12px}
button{padding:12px 22px;font-weight:bold;border-radius:10px;background:#000;color:#fff;border:0;font-size:16px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid #000}
</style>
</head>
<body>
<h2>🎲 LUDO KING 🎲</h2>
<div id="dice" onclick="roll()">🎲</div>
<h3 id="info">RED Turn - Roll!</h3>
<div id="board"></div>
<button onclick="roll()">🎲 ROLL DICE</button
