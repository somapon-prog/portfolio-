<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Snake - Somapon</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;touch-action:none}
body{background:#0f172a;color:#fff;font-family:Arial;display:flex;flex-direction:column;align-items:center;min-height:100vh}
.top{width:100%;max-width:400px;display:flex;justify-content:space-between;padding:15px;background:#1e293b}
.top a{color:#22c55e;text-decoration:none;font-weight:bold}
#box{width:95vw;max-width:380px;height:380px;background:#020617;border:3px solid #22c55e44;border-radius:12px;position:relative;overflow:hidden;margin-top:10px}
.snake{position:absolute;width:18px;height:18px;background:#22c55e;border-radius:4px}
.food{position:absolute;width:18px;height:18px;background:#ef4444;border-radius:50%}
.ctrl{margin-top:20px;display:grid;grid-template-columns:70px 70px 70px;grid-template-rows:60px 60px;gap:10px}
.ctrl button{font-size:28px;background:#1e293b;border:2px solid #334155;border-radius:12px;color:#fff}
#center{grid-column:2}
</style>
</head>
<body>
<div class="top"><a href="../">← Hub</a><div id="sc">SCORE: 0</div><div>🐍</div></div>
<div id="box"></div>
<div class="ctrl">
<button style="grid-column:2" ontouchstart="nd='up'" onclick="nd='up'">⬆️</button>
<button ontouchstart="nd='left'" onclick="nd='left'">⬅️</button>
<button ontouchstart="nd='down'" onclick="nd='down'">⬇️</button>
<button ontouchstart="nd='right'" onclick="nd='right'">➡️</button>
</div>
<script>
let box=document.getElementById('box'), sc=document.getElementById('sc');
let snake=[{x:5,y:10},{x:4,y:10},{x:3,y:10}], food={x:15,y:10}, dir='right', nd='right', score=0, over=false;
function draw(){
box.innerHTML='';
let f=document.createElement('div');f.className='food';f.style.left=food.x*19+'px';f.style.top=food.y*19+'px';box.appendChild(f);
snake.forEach((s,i)=>{let d=document.createElement('div');d.className='snake';d.style.left=s.x*19+'px';d.style.top=s.y*19+'px';if(i==0)d.style.background='#4ade80';box.appendChild(d);});
}
function move(){
if(over) return;
dir=nd;
let h={...snake[0]};
if(dir=='up')h.y--; if(dir=='down')h.y++; if(dir=='left')h.x--; if(dir=='right')h.x++;
if(h.x<0||h.y<0||h.x>=20||h.y>=20||snake.some(s=>s.x==h.x&&s.y==h.y)){over=true;alert('Over Score:'+score);location.reload();return;}
snake.unshift(h);
if(h.x==food.x&&h.y==food.y){score+=10;sc.innerText='SCORE:'+score;food={x:Math.floor(Math.random()*20),y:Math.floor(Math.random()*20)};}else snake.pop();
draw();
}
setInterval(move,140);
draw();
document.addEventListener('keydown',e=>{if(e.key=='ArrowUp'&&dir!='down')nd='up';if(e.key=='ArrowDown'&&dir!='up')nd='down';if(e.key=='ArrowLeft'&&dir!='right')nd='left';if(e.key=='ArrowRight'&&dir!='left')nd='right';});
</script>
</body>
</html>
