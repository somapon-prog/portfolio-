<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Flappy Bird Pro</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0f172a;color:#fff;font-family:Arial;overflow:hidden;text-align:center}
#top{height:50px;background:#1e293b;display:flex;justify-content:space-between;align-items:center;padding:0 15px}
#top a{color:#22c55e;text-decoration:none;font-weight:bold}
canvas{background:linear-gradient(#38bdf8,#0ea5e9);display:block;margin:10px auto;border-radius:12px}
#tap{font-size:18px;margin-top:5px}
</style>
</head>
<body>
<div id="top"><a href="../">⬅ Hub</a><div id="s">SCORE:0</div><div>🐦</div></div>
<canvas id="c" width="360" height="600"></canvas>
<div id="tap">TAP TO FLY 👆</div>
<script>
const c=document.getElementById('c'),X=c.getContext('2d');
let b={x:80,y:250,w:34,h:24,vy:0},p=[],sc=0,f=0;
function add(){let h=Math.random()*200+50; p.push({x:360,y:0,w:60,h:h},{x:360,y:h+150,w:60,h:600})}
X.fillStyle='#000';
function loop(){
f++;X.clearRect(0,0,360,600);
b.vy+=0.4;b.y+=b.vy;
if(f%90==0)add();
for(let i=0;i<p.length;i++){p[i].x-=3;X.fillStyle='#22c55e';X.fillRect(p[i].x,p[i].y,p[i].w,p[i].h);
if(b.x<b.x+p[i].w&&b.x+b.w>p[i].x&&b.y<b.y+p[i].h&&b.y+b.h>p[i].y){alert('Game Over Score:'+sc);b.y=250;b.vy=0;p=[];sc=0}
if(p[i].x==80)sc++;
}
X.fillStyle='#facc15';X.fillRect(b.x,b.y,b.w,b.h);
if(b.y>600||b.y<0){alert('Game Over Score:'+sc);b.y=250;b.vy=0;p=[];sc=0}
document.getElementById('s').innerText='SCORE:'+sc;
requestAnimationFrame(loop);
}
loop();
function fly(){b.vy=-7}
c.addEventListener('touchstart',e=>{e.preventDefault();fly()});
c.addEventListener('mousedown',fly);
addEventListener('keydown',e=>{if(e.code=='Space')fly()});
</script>
</body>
</html>
